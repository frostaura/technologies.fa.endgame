# The console: a static single-page bundle. Routing of /api is the edge's job, not this server's.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness for the compose healthcheck and the control plane's status probe.
  location = /health {
    default_type application/json;
    return 200 '{"status":"healthy","service":"console"}';
  }

  # Hashed assets never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
