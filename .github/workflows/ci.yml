name: CI

# Push, pull request and manual dispatch only. No scheduled trigger, ever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # This repository's dev Mac needs it (broken workload set); harmless on the runner, so the
  # commands are identical in both places.
  MSBuildEnableWorkloadResolver: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/backend/Endgame.slnx

      - name: Format check
        run: dotnet format src/backend/Endgame.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build (warnings are errors)
        run: dotnet build src/backend/Endgame.slnx --nologo --no-restore

      # The real-Docker hosting tests build three images and an app; they run in their own job
      # (Hosting, below) with the time they need, and are skipped here — loudly, never silently.
      - name: Test (real-Docker hosting tests skipped here; see the Hosting job)
        env:
          ENDGAME_SKIP_DOCKER_TESTS: "1"
        run: |
          echo "::notice title=Real-Docker tests skipped in this job::The Category=Docker hosting tests run in the 'Hosting (real Docker)' job."
          dotnet test src/backend/Endgame.Tests/Endgame.Tests.csproj --nologo --no-build

  hosting:
    name: Hosting (real Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - name: Pack the app kit into the template (the template test needs it)
        run: make appkit-vendor

      - name: Real-Docker hosting tests (Dock, Edge and the egress proxy on the runner's engine)
        run: dotnet test src/backend/Endgame.Tests/Endgame.Tests.csproj --nologo --filter "Category=Docker"

  appkit:
    name: App kit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - name: Build (SDKs, template; warnings are errors)
        run: make appkit-build
      - name: Lint
        run: make appkit-lint
      - name: Test (against a throwaway PostgreSQL)
        run: make appkit-test
      - name: Install Chromium for the proof
        working-directory: src/appkit/proof
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Both-addresses proof, in a real browser, against the kit's dev platform
        run: make appkit-proof

  # The ops service (ARCH-007): unit tests, the reconciler against a fake Cloudflare, the outage
  # Worker under Node, and the backup -> destroy -> restore rehearsal, which builds and runs a whole
  # throwaway stack of its own (plus a local S3-compatible server) on the runner's Docker engine.
  ops:
    name: Ops (with the restore rehearsal)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      # The rehearsal's stack builds Dock, whose image carries the app kit's template.
      - name: Pack the app kit into the template
        run: make appkit-vendor

      # The runner's socket is root:docker; the rehearsal's Dock joins that group, as it would on a
      # Linux host. The rehearsal reads no .env, so the value goes in the job's environment.
      - name: Docker socket group for Dock
        run: echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Ops tests (make ops-test)
        run: make ops-test

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test -- --run

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: npm audit gate (high and critical, expiring allowlist)
        working-directory: src/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run audit:gate

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Vulnerable NuGet packages (direct and transitive)
        run: |
          set -euo pipefail
          dotnet restore src/backend/Endgame.slnx
          dotnet list src/backend/Endgame.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          node -e "
            const report = JSON.parse(require('fs').readFileSync('vulnerable.json', 'utf8'));
            const hits = [];
            for (const project of report.projects ?? [])
              for (const fw of project.frameworks ?? [])
                for (const pkg of [...(fw.topLevelPackages ?? []), ...(fw.transitivePackages ?? [])])
                  if ((pkg.vulnerabilities ?? []).length) hits.push(pkg.id + ' ' + pkg.resolvedVersion);
            if (hits.length) { console.error('Vulnerable NuGet packages:\n' + hits.join('\n')); process.exit(1); }
            console.log('No vulnerable NuGet packages.');
          "

  stack-smoke:
    name: Stack smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Parse the production stack file
        run: make prod-config

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - name: Bring the stack up and probe it through the edge
        # The runner's socket is root:docker; Dock joins that group, as it would on a Linux host.
        run: |
          cp .env.example .env
          echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> .env
          make smoke

      - name: Tear down
        if: always()
        run: make docker-down

  e2e:
    name: E2E smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies and Chromium
        working-directory: src/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Bring the stack up
        run: |
          cp .env.example .env
          echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> .env
          make up

      - name: Playwright against the stack, through the edge
        run: make e2e

      - name: Upload Playwright artefacts
        uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright
          path: |
            src/frontend/test-results/
            src/frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make docker-down

  stack-acceptance:
    name: Stack acceptance (make e2e-stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies and Chromium
        run: |
          (cd src/frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          (cd src/appkit/proof && npm ci --no-audit --no-fund)

      - name: The merged stack, end to end, on a fresh database (torn down afterwards)
        run: |
          cp .env.example .env
          echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> .env
          make e2e-stack

      - name: Upload Playwright artefacts
        uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: stack-acceptance
          path: src/frontend/test-results/stack/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================================
  # Publish — on a push to main, after every gate above. Seven images, each built natively for
  # amd64 and arm64 (the .NET SDK is not run under emulation), pushed to Docker Hub by digest and
  # joined into one multi-arch tag: an immutable sha-<commit>, and :latest following it.
  #
  # Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN. The namespace the images are pushed under is the
  # repository variable DOCKERHUB_NAMESPACE, or `frostaura` — the same default the production stack
  # pulls from (ENDGAME_IMAGE_NAMESPACE). Each image is BUILT before the login, so without the
  # secrets a job fails at "Log in to Docker Hub" and nowhere earlier.
  # ============================================================================================
  publish:
    name: Publish ${{ matrix.image }} (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, hosting, appkit, ops, frontend, security, stack-smoke, e2e, stack-acceptance]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      REPOSITORY: ${{ vars.DOCKERHUB_NAMESPACE || 'frostaura' }}/technologies.fa.endgame-${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [control-plane, edge, runner, dock, console, egress, ops]
        include:
          - { image: control-plane, context: ., dockerfile: src/backend/Dockerfile, project: Endgame.ControlPlane }
          - { image: edge, context: ., dockerfile: src/backend/Dockerfile, project: Endgame.Edge }
          - { image: runner, context: ., dockerfile: src/backend/Dockerfile, project: Endgame.Runner }
          - { image: dock, context: ., dockerfile: src/backend/Dockerfile, project: Endgame.Dock }
          - { image: console, context: ., dockerfile: src/frontend/Dockerfile, project: "" }
          - { image: egress, context: src/egress, dockerfile: src/egress/Dockerfile, project: "" }
          - { image: ops, context: ., dockerfile: src/ops/Dockerfile, project: "" }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      # Dock's image carries the app kit's template, packed first (as `make up` does).
      - uses: actions/setup-dotnet@v6.1.0
        if: matrix.image == 'dock'
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        if: matrix.image == 'dock'
        with:
          node-version: "26"
      - name: Pack the app kit into the template
        if: matrix.image == 'dock'
        run: make appkit-vendor
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          build-args: |
            PROJECT=${{ matrix.project }}
            BUILD_SHA=${{ github.sha }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The same build again, answered from the builder's cache; only the push is new.
      - name: Push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            PROJECT=${{ matrix.project }}
            BUILD_SHA=${{ github.sha }}
          tags: ${{ env.REPOSITORY }}:sha-${{ github.sha }}-${{ matrix.arch }}

  publish-manifest:
    name: Tag ${{ matrix.image }} (multi-arch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPOSITORY: ${{ vars.DOCKERHUB_NAMESPACE || 'frostaura' }}/technologies.fa.endgame-${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [control-plane, edge, runner, dock, console, egress, ops]
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Join both architectures under sha-<commit> and latest
        run: |
          docker buildx imagetools create \
            --tag "${REPOSITORY}:sha-${GITHUB_SHA}" \
            --tag "${REPOSITORY}:latest" \
            "${REPOSITORY}:sha-${GITHUB_SHA}-amd64" \
            "${REPOSITORY}:sha-${GITHUB_SHA}-arm64"

  # ============================================================================================
  # Redeploy — ask Portainer to pull the new images and redeploy the stack it already holds.
  # Off until the stack exists: create it first (docs/architecture/ARCH-008), then set the secrets
  # PORTAINER_URL, PORTAINER_TOKEN, PORTAINER_ENDPOINT_ID and PORTAINER_STACK_ID and the repository
  # variable DEPLOY_ENABLED=true. While the variable is unset the job is skipped, not failed.
  # The stack file and its environment are sent back exactly as Portainer holds them: a redeploy
  # moves images and nothing else.
  # ============================================================================================
  deploy:
    name: Redeploy on Portainer
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pull the new images and redeploy the stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -euo pipefail
          : "${PORTAINER_URL:?secret PORTAINER_URL is required}"
          : "${PORTAINER_TOKEN:?secret PORTAINER_TOKEN is required}"
          : "${PORTAINER_ENDPOINT_ID:?secret PORTAINER_ENDPOINT_ID is required}"
          : "${PORTAINER_STACK_ID:?secret PORTAINER_STACK_ID is required}"
          api="${PORTAINER_URL%/}/api"
          work="$(mktemp -d)"

          curl -fsSL -H "X-API-Key: ${PORTAINER_TOKEN}" "${api}/stacks/${PORTAINER_STACK_ID}/file" \
            | jq -r '.StackFileContent' > "${work}/stack.yml"
          curl -fsSL -H "X-API-Key: ${PORTAINER_TOKEN}" "${api}/stacks/${PORTAINER_STACK_ID}" \
            | jq -c '.Env // []' > "${work}/env.json"
          test -s "${work}/stack.yml" || { echo "Portainer returned an empty stack file" >&2; exit 1; }

          jq -n --rawfile file "${work}/stack.yml" --slurpfile env "${work}/env.json" \
            '{stackFileContent: $file, env: $env[0], prune: false, pullImage: true}' > "${work}/body.json"

          status=$(curl -sS -o "${work}/response.json" -w "%{http_code}" \
            -X PUT "${api}/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_TOKEN}" -H "Content-Type: application/json" \
            --data-binary "@${work}/body.json")
          if [ "${status}" != "200" ]; then
            # Portainer's own message, never the request (which carries the stack's environment).
            echo "Portainer refused the redeploy (HTTP ${status}): $(jq -r '.message // .details // "no message"' "${work}/response.json")" >&2
            exit 1
          fi
          echo "Portainer accepted the redeploy."
