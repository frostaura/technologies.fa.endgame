# Local development stack: `make up`.
#
# Every value has a development default here, so a fresh clone runs with an empty .env (only key
# names are in .env.example). docker-compose.prod.yml requires each secret instead and can never
# turn the development sign-in on.
#
# The control plane runs in Development with ENDGAME_DEV_LOGIN=true by default, so `make up` gives a
# developer the development sign-in. Service addresses never depend on the environment name: each
# peer is found by its compose name in every environment. Every other service runs as Production.
#
# A second stack beside this one (an integration run, a demo): set COMPOSE_PROJECT_NAME, the host
# ports and DOCK_SUBNET_POOL in the environment, e.g. `make up COMPOSE_PROJECT_NAME=endgame-int
# EDGE_HOST_PORT=18095 POSTGRES_HOST_PORT=15446 MAIL_UI_HOST_PORT=18026 DOCK_SUBNET_POOL=10.215.0.0/16`.
# Its Dock then owns only its own apps (Dock__Instance) and cuts their networks from its own pool.
#
# Every service uses `restart: always`, not the `unless-stopped` of docker-compose.prod.yml.
# Quitting Docker Desktop stops the containers, and `unless-stopped` then declines to bring them
# back when the daemon starts again; `always` restarts them with the daemon. On the production
# host `unless-stopped` is right, because there an operator's stop should stick.
name: ${COMPOSE_PROJECT_NAME:-endgame}

x-dotnet-service: &dotnet-service
  restart: always
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Production
    # Every internal API call between services carries this (ARCH-004).
    ENDGAME_SERVICE_TOKEN: ${ENDGAME_SERVICE_TOKEN:-endgame_dev_service_token_change_me}
  healthcheck:
    test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health > /dev/null || exit 1" ]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s

services:
  postgres:
    image: postgres:16.16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-endgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-endgame_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-endgame}
    ports:
      # Host-side dev only (dotnet ef, psql); loopback so nothing else on the network reaches it.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5446}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endgame} -d ${POSTGRES_DB:-endgame}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.ControlPlane }
    environment:
      <<: *dotnet-env
      # Development turns on the development sign-in (with ENDGAME_DEV_LOGIN) and the mail catcher
      # (appsettings.Development.json). Set ENDGAME_CONTROL_PLANE_ENVIRONMENT=Production to run without both.
      ASPNETCORE_ENVIRONMENT: ${ENDGAME_CONTROL_PLANE_ENVIRONMENT:-Development}
      ENDGAME_DEV_LOGIN: ${ENDGAME_DEV_LOGIN:-true}
      ConnectionStrings__Endgame: Host=postgres;Port=5432;Database=${POSTGRES_DB:-endgame};Username=${POSTGRES_USER:-endgame};Password=${POSTGRES_PASSWORD:-endgame_dev_password}
      Database__AutoMigrateOnStartup: "true"
      # The only component holding the OpenRouter key (ARCH-004). Empty: model calls are refused, nothing else changes.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Seals every secret and derives app tokens: 32 bytes as hex or base64. Development value only.
      ENDGAME_VAULT_MASTER_KEY: ${ENDGAME_VAULT_MASTER_KEY:-656e6467616d652d6465762d7661756c742d6d61737465722d6b65792d303031}
      # God mode comes from this explicit list alone (comma-separated e-mail addresses).
      ENDGAME_OPERATORS: ${ENDGAME_OPERATORS:-operator@endgame.localhost}
      # The addresses apps are given, as a browser on this machine reaches the edge.
      Addresses__PathHost: localhost
      Addresses__OrganisationDomain: localhost
      Addresses__Scheme: http
      Addresses__Port: ${EDGE_HOST_PORT:-8095}
      # No mail leaves this machine: every message lands in the mail catcher.
      Smtp__Host: mailcatcher
      Smtp__Port: "1025"
      Smtp__From: endgame@endgame.localhost
      Smtp__StartTls: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mailcatcher:
        condition: service_healthy

  runner:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Runner }

  dock:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Dock }
    environment:
      <<: *dotnet-env
      Dock__SecretKey: ${DOCK_SECRET_KEY:-endgame_dev_dock_secret_key_change_me_now}
      Dock__PostgresAdmin: Host=postgres;Port=5432;Database=postgres;Username=${POSTGRES_USER:-endgame};Password=${POSTGRES_PASSWORD:-endgame_dev_password}
      # Everything this Dock creates is labelled with its stack's name, and nothing else is touched.
      Dock__Instance: ${COMPOSE_PROJECT_NAME:-endgame}
      Dock__SubnetPool: ${DOCK_SUBNET_POOL:-10.213.0.0/16}
      Dock__Peers__Edge: ${COMPOSE_PROJECT_NAME:-endgame}-edge-1
      Dock__Peers__Postgres: ${COMPOSE_PROJECT_NAME:-endgame}-postgres-1
      Dock__Peers__Egress: ${COMPOSE_PROJECT_NAME:-endgame}-egress-1
      Dock__AppMemoryBudgetMb: ${DOCK_APP_MEMORY_BUDGET_MB:-4096}
      Dock__UsageReportSeconds: ${ENDGAME_USAGE_REPORT_SECONDS:-300}
    # The ONLY service given the Docker socket (CLAUDE.md rule 5). Never copy these two keys elsewhere.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dock_data:/data
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      egress:
        condition: service_healthy

  # Default-deny forward proxy: the only way out for apps, workspaces and builds. Dock writes its
  # per-network allow-lists through the Engine API; it shares no volume or network with Dock.
  egress:
    build:
      context: src/egress
    restart: always
    # IPv4 only: with an IPv6 address it cannot route, the proxy tries it first and gives up.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1

  # Development only: an SMTP server on 1025 that keeps every message and sends none. Its web view
  # and API (GET /api/v1/messages) are on loopback.
  mailcatcher:
    image: axllent/mailpit:v1.27.10
    restart: always
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAIL_UI_HOST_PORT:-8126}:8025"
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 5s
      timeout: 3s
      retries: 12

  console:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12

  edge:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Edge }
    environment:
      <<: *dotnet-env
      Edge__PlatformOrigin: http://localhost:${EDGE_HOST_PORT:-8095}
      Edge__AppSubnetPools__0: ${DOCK_SUBNET_POOL:-10.213.0.0/16}
      Edge__UsageReportSeconds: ${ENDGAME_USAGE_REPORT_SECONDS:-300}
    ports:
      - "${EDGE_HOST_PORT:-8095}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      console:
        condition: service_healthy

  # Operations (ARCH-007): the nightly encrypted backup of every database and the repositories
  # volume, and — only when a Cloudflare token is set — DNS, tunnel ingress and the outage page.
  # With no bucket configured, archives go to ENDGAME_BACKUP_DIR (a host path) or, by default, the
  # `backup` volume, and /health says they are not offsite. Its internal API needs the service token.
  ops:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/ops/Dockerfile
    environment:
      <<: *dotnet-env
      # Development value only: production requires its own (docker-compose.prod.yml).
      Ops__Backup__Key: ${ENDGAME_BACKUP_KEY:-656e6467616d652d6465762d6261636b75702d6b65792d6e6f742d7365637265}
      Ops__Backup__Postgres: Host=postgres;Port=5432;Database=postgres;Username=${POSTGRES_USER:-endgame};Password=${POSTGRES_PASSWORD:-endgame_dev_password}
      Ops__Backup__S3Endpoint: ${ENDGAME_BACKUP_S3_ENDPOINT:-}
      Ops__Backup__S3Bucket: ${ENDGAME_BACKUP_S3_BUCKET:-}
      Ops__Backup__S3AccessKeyId: ${ENDGAME_BACKUP_S3_ACCESS_KEY_ID:-}
      Ops__Backup__S3SecretAccessKey: ${ENDGAME_BACKUP_S3_SECRET_ACCESS_KEY:-}
      Ops__Backup__S3Region: ${ENDGAME_BACKUP_S3_REGION:-auto}
      Ops__Backup__HourUtc: ${BACKUP_HOUR_UTC:-1}
      Ops__Backup__KeepDaily: ${ENDGAME_BACKUP_KEEP_DAILY:-7}
      Ops__Backup__KeepWeekly: ${ENDGAME_BACKUP_KEEP_WEEKLY:-4}
      Ops__Backup__ScheduleEnabled: ${ENDGAME_BACKUP_SCHEDULE:-true}
      Ops__Cloudflare__BaseUrl: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      Ops__Cloudflare__ApiToken: ${CLOUDFLARE_API_TOKEN:-}
      Ops__Cloudflare__AccountId: ${CLOUDFLARE_ACCOUNT_ID:-}
      Ops__Cloudflare__ZoneId: ${CLOUDFLARE_ZONE_ID:-}
      Ops__Cloudflare__TunnelId: ${CLOUDFLARE_TUNNEL_ID:-}
      Ops__Cloudflare__Zone: ${ENDGAME_ZONE:-}
      Ops__Cloudflare__ConsoleHost: ${ENDGAME_CONSOLE_HOST:-}
    volumes:
      # Read for a backup, written by a restore (with Dock stopped): the same volume Dock keeps at /data.
      - dock_data:/data/dock
      - ${ENDGAME_BACKUP_DIR:-backup}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  # Every app's repository and Dock's small state. Code history: backed up with the database.
  dock_data:
  # Local backups when no bucket is configured (see the ops service).
  backup:
