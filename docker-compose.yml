# Local development stack: `make up`.
#
# Every service uses `restart: always`, not the `unless-stopped` of docker-compose.prod.yml.
# Quitting Docker Desktop stops the containers, and `unless-stopped` then declines to bring them
# back when the daemon starts again; `always` restarts them with the daemon. On the production
# host `unless-stopped` is right, because there an operator's stop should stick.
#
# The project name is pinned so the volume names never depend on the clone's folder name.
name: endgame

x-dotnet-service: &dotnet-service
  restart: always
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    # Every internal API call between services carries this (ARCH-004).
    ENDGAME_SERVICE_TOKEN: ${ENDGAME_SERVICE_TOKEN:?ENDGAME_SERVICE_TOKEN is required (copy .env.example to .env)}
  healthcheck:
    test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health > /dev/null || exit 1" ]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s

services:
  postgres:
    image: postgres:16.16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-endgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-endgame}
    ports:
      # Host-side dev only (dotnet ef, psql); loopback so nothing else on the network reaches it.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5446}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endgame} -d ${POSTGRES_DB:-endgame}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.ControlPlane }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Endgame: Host=postgres;Port=5432;Database=${POSTGRES_DB:-endgame};Username=${POSTGRES_USER:-endgame};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrateOnStartup: "true"
      # The only component holding the OpenRouter key (ARCH-004).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  runner:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Runner }

  dock:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Dock }
    environment:
      <<: *dotnet-env
      Dock__SecretKey: ${DOCK_SECRET_KEY:?DOCK_SECRET_KEY is required (copy .env.example to .env)}
      Dock__PostgresAdmin: Host=postgres;Port=5432;Database=postgres;Username=${POSTGRES_USER:-endgame};Password=${POSTGRES_PASSWORD}
      Dock__Peers__Edge: endgame-edge-1
      Dock__Peers__Postgres: endgame-postgres-1
      Dock__Peers__Egress: endgame-egress-1
      Dock__AppMemoryBudgetMb: ${DOCK_APP_MEMORY_BUDGET_MB:-4096}
    # The ONLY service given the Docker socket (CLAUDE.md rule 5). Never copy these two keys elsewhere.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dock_data:/data
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      egress:
        condition: service_healthy

  # Default-deny forward proxy: the only way out for apps, workspaces and builds. Dock writes its
  # per-network allow-lists through the Engine API; it shares no volume or network with Dock.
  egress:
    build:
      context: src/egress
    restart: always
    # IPv4 only: with an IPv6 address it cannot route, the proxy tries it first and gives up.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1

  console:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12

  edge:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Edge }
    environment:
      <<: *dotnet-env
      Edge__PlatformOrigin: http://localhost:${EDGE_HOST_PORT:-8095}
    ports:
      - "${EDGE_HOST_PORT:-8095}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      console:
        condition: service_healthy

volumes:
  postgres_data:
  # Every app's repository and Dock's small state. Code history: backed up with the database.
  dock_data:
