# Local development stack: `make up`.
#
# Every service uses `restart: always`, not the `unless-stopped` of docker-compose.prod.yml.
# Quitting Docker Desktop stops the containers, and `unless-stopped` then declines to bring them
# back when the daemon starts again; `always` restarts them with the daemon. On the production
# host `unless-stopped` is right, because there an operator's stop should stick.
#
# The project name is pinned so the volume names never depend on the clone's folder name.
name: endgame

x-dotnet-service: &dotnet-service
  restart: always
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  healthcheck:
    test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health > /dev/null || exit 1" ]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s

services:
  postgres:
    image: postgres:16.16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-endgame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-endgame}
    ports:
      # Host-side dev only (dotnet ef, psql); loopback so nothing else on the network reaches it.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5446}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endgame} -d ${POSTGRES_DB:-endgame}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.ControlPlane }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Endgame: Host=postgres;Port=5432;Database=${POSTGRES_DB:-endgame};Username=${POSTGRES_USER:-endgame};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy

  runner:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Runner }

  dock:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Dock }
    # The ONLY service given the Docker socket (CLAUDE.md rule 5). Never copy these two keys elsewhere.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"

  console:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12

  edge:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args: { PROJECT: Endgame.Edge }
    ports:
      - "${EDGE_HOST_PORT:-8095}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      console:
        condition: service_healthy

volumes:
  postgres_data:
